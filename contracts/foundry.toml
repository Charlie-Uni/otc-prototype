[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = '0.8.30'
remappings = [
  'openzeppelin/=lib/openzeppelin-contracts/contracts/',
  'forge-std/=lib/forge-std/src/'
]

# Pin fuzz runs explicitly (matches the "256 runs per fuzz test" claim in the docs)
# instead of relying on the Foundry default silently staying at 256.
[fuzz]
runs = 256

# Keep stateful verification reproducible across Foundry upgrades. The handler
# constrains calls to valid lifecycle transitions and handles expected reverts.
[invariant]
runs = 128
depth = 64
fail_on_revert = true

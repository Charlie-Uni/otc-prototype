name: Paper 8.5 M0 Equivalence

on:
  push:
    paths:
      - 'contracts/src/**'
      - 'experiments/paper85-evaluation/contracts/generated/**'
      - 'experiments/paper85-evaluation/contracts/test/M0Differential*.sol'
      - 'experiments/paper85-evaluation/contracts/test/ScenarioFixtures.sol'
      - 'experiments/paper85-evaluation/contracts/test/M0Differential.t.sol'
      - 'experiments/paper85-evaluation/patches/**'
      - 'experiments/paper85-evaluation/scripts/**'
      - 'experiments/paper85-evaluation/spec/**'
      - 'experiments/paper85-evaluation/spec-v2/**'
      - 'experiments/paper85-evaluation/docs/m0-runbook.md'
      - '.github/workflows/paper85-m0.yml'
  pull_request:
    paths:
      - 'contracts/src/**'
      - 'experiments/paper85-evaluation/contracts/generated/**'
      - 'experiments/paper85-evaluation/contracts/test/M0Differential*.sol'
      - 'experiments/paper85-evaluation/contracts/test/ScenarioFixtures.sol'
      - 'experiments/paper85-evaluation/contracts/test/M0Differential.t.sol'
      - 'experiments/paper85-evaluation/patches/**'
      - 'experiments/paper85-evaluation/scripts/**'
      - 'experiments/paper85-evaluation/spec/**'
      - 'experiments/paper85-evaluation/spec-v2/**'
      - 'experiments/paper85-evaluation/docs/m0-runbook.md'
      - '.github/workflows/paper85-m0.yml'

jobs:
  m0-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install source-locked Foundry dependencies
        working-directory: contracts
        run: |
          mkdir -p lib
          git clone --branch v1.10.0 --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --branch v5.4.0 --depth 1 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts

      - name: Verify preregistration and generated sources
        run: |
          node experiments/paper85-evaluation/scripts/validate-manifest.mjs
          node experiments/paper85-evaluation/scripts/prereg-lock.mjs --check
          node experiments/paper85-evaluation/scripts/generate-experimental-contracts.mjs --check
          node experiments/paper85-evaluation/scripts/generate-m0-tests.mjs --check
          node experiments/paper85-evaluation/scripts/generate-state-assertions.mjs --check
          node experiments/paper85-evaluation/scripts/evaluation-lock.mjs --check

      - name: Test manifest and state-assertion integrity guards
        run: node --test experiments/paper85-evaluation/scripts/*.test.mjs

      - name: Check Solidity formatting
        working-directory: experiments/paper85-evaluation/contracts
        run: forge fmt --check

      - name: Run M0 twice and verify semantic digests
        run: node experiments/paper85-evaluation/scripts/run-m0.mjs

      - name: Upload M0 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper85-m0-evidence-${{ github.run_id }}
          path: experiments/paper85-evaluation/results
          if-no-files-found: error
          retention-days: 90

name: Static Analysis

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck 0.11.0
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive=/tmp/shellcheck.tar.xz
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check
          tar -xJf "$archive" -C /tmp
          echo "/tmp/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Analyze shell scripts
        run: |
          set -euo pipefail
          mkdir -p static-analysis
          shellcheck --version | tee static-analysis/shellcheck.log
          shellcheck --severity=warning --format=gcc \
            scripts/test-chapter3.sh \
            scripts/smoke-risk-api.sh \
            2>&1 | tee -a static-analysis/shellcheck.log

      - name: Upload ShellCheck evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shellcheck-evidence
          path: static-analysis/shellcheck.log
          if-no-files-found: error

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Foundry dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.10.0 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-git

      - name: Install pinned Slither toolchain
        run: |
          python -m pip install --disable-pip-version-check \
            slither-analyzer==0.11.5 \
            crytic-compile==0.3.11

      - name: Record analyzer versions
        run: |
          mkdir -p static-analysis
          slither --version | tee static-analysis/slither-versions.txt
          crytic-compile --version | tee -a static-analysis/slither-versions.txt

      - name: Analyze business contracts
        id: slither
        continue-on-error: true
        working-directory: contracts
        run: |
          set -o pipefail
          slither . \
            --config-file slither.config.json \
            --json ../static-analysis/slither.json \
            2>&1 | tee ../static-analysis/slither.log

      - name: Record Slither outcome
        if: always()
        env:
          SLITHER_OUTCOME: ${{ steps.slither.outcome }}
        run: |
          echo "Slither step outcome: $SLITHER_OUTCOME" | tee -a static-analysis/slither-versions.txt
          echo "### Slither" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: \`$SLITHER_OUTCOME\` (non-blocking during initial triage)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Slither evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slither-evidence
          path: |
            static-analysis/slither.json
            static-analysis/slither.log
            static-analysis/slither-versions.txt
          if-no-files-found: error

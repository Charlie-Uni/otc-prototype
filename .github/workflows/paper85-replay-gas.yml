name: Paper 8.5 Replay and Gas

on:
  push:
    paths:
      - 'contracts/src/**'
      - 'contracts/foundry.toml'
      - 'apps/api/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'experiments/paper85-evaluation/scripts/**'
      - 'experiments/paper85-evaluation/spec/**'
      - 'experiments/paper85-evaluation/spec-v2/**'
      - '.github/workflows/paper85-replay-gas.yml'
  pull_request:
    paths:
      - 'contracts/src/**'
      - 'contracts/foundry.toml'
      - 'apps/api/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'experiments/paper85-evaluation/scripts/**'
      - 'experiments/paper85-evaluation/spec/**'
      - 'experiments/paper85-evaluation/spec-v2/**'
      - '.github/workflows/paper85-replay-gas.yml'

jobs:
  replay-and-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install source-locked Foundry dependencies
        working-directory: contracts
        run: |
          mkdir -p lib
          git clone --branch v1.10.0 --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --branch v5.4.0 --depth 1 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts

      - name: Install Node dependencies
        run: |
          corepack enable
          corepack pnpm@9.6.0 install --frozen-lockfile

      - name: Verify frozen inputs and measurement implementation
        run: |
          node experiments/paper85-evaluation/scripts/validate-manifest.mjs
          node experiments/paper85-evaluation/scripts/prereg-lock.mjs --check
          node experiments/paper85-evaluation/scripts/generate-experimental-contracts.mjs --check
          node experiments/paper85-evaluation/scripts/generate-m0-tests.mjs --check
          node experiments/paper85-evaluation/scripts/generate-state-assertions.mjs --check
          node experiments/paper85-evaluation/scripts/evaluation-lock.mjs --check

      - name: Test measurement helpers
        run: node --test experiments/paper85-evaluation/scripts/*.test.mjs

      - name: Run closed-input replay twice
        run: node experiments/paper85-evaluation/scripts/run-replay.mjs

      - name: Measure production contract gas in repeated batches
        run: node experiments/paper85-evaluation/scripts/run-gas.mjs

      - name: Upload replay and gas evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper85-replay-gas-evidence-${{ github.run_id }}
          path: experiments/paper85-evaluation/results
          if-no-files-found: error
          retention-days: 90
